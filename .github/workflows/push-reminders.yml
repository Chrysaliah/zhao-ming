name: Push Reminders

on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Morning reminder (8:00 Beijing)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSH_HOUR: "8"
        run: node .github/scripts/send-push.js
      - name: Evening reminder (22:30 Beijing)
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSH_HOUR: "22"
        run: node .github/scripts/send-push.js
