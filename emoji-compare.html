<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emoji 对比</title>
<script src="https://cdn.jsdelivr.net/npm/twemoji@14.15.0/dist/twemoji.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#f5f5f5;padding:20px;max-width:420px;margin:0 auto}
h2{font-size:16px;margin-bottom:12px;color:#333}
.section{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px}
.section h3{font-size:13px;color:#666;margin-bottom:12px}
.row{display:flex;gap:8px}
.item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:10px;background:#f9f9f9}
.face{font-size:32px;line-height:1;height:36px;display:flex;align-items:center;justify-content:center}
.face img{width:32px;height:32px}
.label{font-size:10px;color:#999}
.note{font-size:11px;color:#aaa;line-height:1.6;padding:0 4px;margin-top:8px}
</style>
</head>
<body>
<h2>Emoji 风格对比</h2>
<div class="section">
<h3>系统 Emoji（你手机上的样子）</h3>
<div class="row">
<div class="item"><span class="face">😞</span><span class="label">很差</span></div>
<div class="item"><span class="face">😕</span><span class="label">不好</span></div>
<div class="item"><span class="face">😐</span><span class="label">一般</span></div>
<div class="item"><span class="face">🙂</span><span class="label">还好</span></div>
<div class="item"><span class="face">😄</span><span class="label">很好</span></div>
</div>
</div>
<div class="section">
<h3>Twemoji（Twitter风格·所有设备一致）</h3>
<div class="row" id="twemojiRow">
<div class="item"><span class="face" data-emoji="😞">😞</span><span class="label">很差</span></div>
<div class="item"><span class="face" data-emoji="😕">😕</span><span class="label">不好</span></div>
<div class="item"><span class="face" data-emoji="😐">😐</span><span class="label">一般</span></div>
<div class="item"><span class="face" data-emoji="🙂">🙂</span><span class="label">还好</span></div>
<div class="item"><span class="face" data-emoji="😄">😄</span><span class="label">很好</span></div>
</div>
</div>
<p class="note">系统Emoji在不同手机品牌上长得不一样（OPPO/小米/苹果各有各的画风）。Twemoji用SVG图片渲染，不管什么手机都显示同一种风格。</p>
<script>
twemoji.parse(document.getElementById('twemojiRow'),{folder:'svg',ext:'.svg'});
</script>
</body>
</html>
